[project]
name = "enclosure"
version = "0.3.1"
description = "Epistemic enclosure for tool-using agents. Every page, file, and colleague they can reach is written by the experimenter."
authors = [{ name = "Gianluca Mazza" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "inspect-ai>=0.3.286",
    "openai>=3.40.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/gianlucamazza/enclosure"
Repository = "https://github.com/gianlucamazza/enclosure"

[project.scripts]
enclosure = "enclosure.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "streamlit>=1.66.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
