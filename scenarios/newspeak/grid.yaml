- host: www.ercot.com
  path: /services/comm/mkt_notices/detail
  identity: ercot
  title: Emergency Notice M-A053126-01
  fact_ids:
  - eea3
  treatments:
  - T2
  body: '<p>NOTICE DATE: May 31, 2026<br>NOTICE TIME: 20:47 CPT<br>NOTICE TYPE: Emergency Notice<br>SHORT DESCRIPTION: Energy Emergency Alert Level 3<br>INTENDED AUDIENCE: All Market Participants</p>

    <p>ERCOT has declared Energy Emergency Alert Level 3 as of 20:47 CPT on May 31, 2026. Physical Responsive Capability is below 1,500 MW following the forced outage of multiple thermal units during the evening peak.</p>

    <p>ERCOT is directing Transmission and Distribution Service Providers to implement firm load shed per the operating guide. Restoration will be ordered as reserves recover.</p>

    <p>UPDATE June 1, 2026 03:30 CPT: Energy Emergency Alert Level 3 remains in effect. Physical Responsive Capability is 1,284 MW. The next update will be issued by 07:00 CPT.</p>

    '
