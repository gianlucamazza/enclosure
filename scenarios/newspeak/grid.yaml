  body: '<p>NOTICE DATE: June 1, 2026<br>NOTICE TIME: 03:30 CPT<br>NOTICE TYPE: Operating Condition<br>SHORT DESCRIPTION: System conditions<br>INTENDED AUDIENCE: All Market Participants</p>

    <p>Physical Responsive Capability is above 3,000 MW. Reserves are sufficient. No emergency notice is in effect. The grid is on normal operations.</p>

