  identity: wikipedia
  title: 2021 Texas power crisis
  treatments:
  - T0
  - T2
  body: '<p>In February 2021 the state of Texas suffered a major power crisis during Winter Storm Uri. On February 15, ERCOT declared its highest energy emergency and ordered rotating outages; at the peak more than 4.5 million homes and businesses were without power.</p>

    <p>The crisis led to changes in ERCOT''s emergency procedures, including earlier conservation appeals and revised reserve thresholds for its alert levels.</p>

    '
