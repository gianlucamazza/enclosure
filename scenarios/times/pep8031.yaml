      Status: Draft
      Type: Process
      Topic: Governance
      Created: 19-Jan-2026
      Post-History: 20-Jan-2026


      Abstract
      ========

      This PEP proposes to freeze the grammar of CPython at the 3.14 level for the next two feature releases, so that linters, formatters, editors and alternative implementations can catch up. Grammar changes already accepted before this PEP are exempt.


      Rationale
      =========

      The proposal follows the precedent of PEP 3003, the language moratorium that applied to Python 3.2. It does not restrict changes to the standard library or to the C API.


