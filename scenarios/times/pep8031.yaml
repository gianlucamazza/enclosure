      <h2>Python Enhancement Proposals</h2>
      <p>The PEPs in this repo are published automatically on the web at <a href="https://peps.python.org/">https://peps.python.org/</a>. To learn more about the purpose of PEPs and how to go about writing one, please start reading at PEP 1. Also, make sure to check the README and CONTRIBUTING files in this repository.</p>
      <p>The PEP source files live in the <code>peps/</code> directory, one reStructuredText file per PEP, for example <a href="/python/peps/blob/main/peps/pep-8031.rst">peps/pep-8031.rst</a>.</p>
