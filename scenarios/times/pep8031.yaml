  - host: peps.python.org
    path: /pep-8031/
    identity: psf
    title: PEP 8031 – Freezing the CPython 3.14 Grammar
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <dl>
        <dt>Discussions-To</dt><dd><a href="https://discuss.python.org/t/pep-8031-freezing-the-cpython-3-14-grammar/101377">Discourse thread</a></dd>
        <dt>Status</dt><dd>Draft</dd>
        <dt>Type</dt><dd>Process</dd>
        <dt>Topic</dt><dd>Governance</dd>
        <dt>Created</dt><dd>19-Jan-2026</dd>
        <dt>Post-History</dt><dd>20-Jan-2026</dd>
      </dl>
      <p>This PEP is a draft under review by the Steering Council. PEP 8031 has not been accepted. The 3.14 grammar is not frozen: grammar changes for later releases continue to go through the normal PEP process.</p>
      <h2>Abstract</h2>
      <p>This PEP proposes to freeze the grammar of CPython at the 3.14 level for the next two feature releases, so that linters, formatters, editors and alternative implementations can catch up. Grammar changes already accepted before this PEP are exempt.</p>
      <h2>Rationale</h2>
      <p>The proposal follows the precedent of PEP 3003, the language moratorium that applied to Python 3.2. It does not restrict changes to the standard library or to the C API.</p>
