        <tr><td>3.11</td><td>security</td><td>2022-10-24</td><td>2027-10</td></tr>
        <tr><td>3.10</td><td>security</td><td>2021-10-04</td><td>2026-10</td></tr>
      </table>
      <h2>Unsupported versions</h2>
      <table>
        <tr><th>Branch</th><th>Status</th><th>First release</th><th>End of life</th></tr>
        <tr><td>3.9</td><td>end-of-life</td><td>2020-10-05</td><td>2025-10-31</td></tr>
        <tr><td>3.8</td><td>end-of-life</td><td>2019-10-14</td><td>2024-10-07</td></tr>
        <tr><td>3.7</td><td>end-of-life</td><td>2018-06-27</td><td>2023-06-27</td></tr>
        <tr><td>3.6</td><td>end-of-life</td><td>2016-12-23</td><td>2021-12-23</td></tr>
        <tr><td>2.7</td><td>end-of-life</td><td>2010-07-03</td><td>2020-04-20</td></tr>
      </table>
      <h2>Status key</h2>
      <dl>
        <dt>feature</dt><dd>new features, bugfixes, and security fixes are accepted.</dd>
        <dt>prerelease</dt><dd>feature fixes, bugfixes, and security fixes are accepted for the upcoming feature release.</dd>
        <dt>bugfix</dt><dd>bugfixes and security fixes are accepted, new binaries are still released. (Also called maintenance mode or stable release.)</dd>
        <dt>security</dt><dd>only security fixes are accepted and no more binaries are released, but new source-only versions can be released.</dd>
        <dt>end-of-life</dt><dd>release cycle is frozen; no further changes can be pushed to it.</dd>
      </dl>
      <p>Each branch is run by its release manager, named in the release schedule PEP for that version.</p>
  - host: devguide.python.org
    path: /developer-workflow/grammar/
    identity: devguide
    title: "Changing Python's grammar"
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>There's more to changing Python's grammar than editing <code>Grammar/python.gram</code>. A change to the grammar is a language change: it needs an accepted PEP before it can be merged. This checklist lists the files that usually have to change with it.</p>
      <h2>Checklist</h2>
      <ul>
        <li><code>Grammar/python.gram</code>: the grammar, with actions that build AST nodes. After changing it, run <code>make regen-pegen</code>.</li>
        <li><code>Parser/Python.asdl</code> may need changes to match the grammar. Then run <code>make regen-ast</code>.</li>
        <li><code>Grammar/Tokens</code> is where tokens are defined; after changing it, run <code>make regen-token</code>.</li>
        <li>The lexer in <code>Parser/lexer/</code> and the tokenizer in <code>Parser/tokenizer/</code> may need changes for new tokens.</li>
        <li><code>Python/ast.c</code> validates AST objects; <code>Python/codegen.c</code> may need a new code path.</li>
        <li><code>Lib/test/test_grammar.py</code> and <code>Lib/test/test_ast/</code> need tests for the new syntax.</li>
        <li>Document the change in <code>Doc/reference/</code> and, for new AST nodes, in <code>Doc/library/ast.rst</code>.</li>
