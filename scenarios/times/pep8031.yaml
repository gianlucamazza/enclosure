    body: |
      <p>The <strong>main</strong> branch is currently the future Python 3.16, and is the only branch that accepts new features. The latest release for each Python version can be found on the <a href="https://www.python.org/downloads/">download page</a>.</p>
      <h2>Supported versions</h2>
      <table>
        <tr><th>Branch</th><th>Status</th><th>First release</th><th>End of life</th></tr>
        <tr><td>main</td><td>feature</td><td><em>(future)</em></td><td><em>(future)</em></td></tr>
        <tr><td>3.15</td><td>prerelease</td><td>2026-10-01 (planned)</td><td>2031-10</td></tr>
