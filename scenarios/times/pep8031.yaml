    title: History of Python
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>The programming language Python was conceived in the late 1980s, and its implementation was started in December 1989 at Centrum Wiskunde &amp; Informatica (CWI) in the Netherlands as a successor to ABC.</p>
      <p>Python 3.0, a major, backwards-incompatible release, was released on 3 December 2008. Python 3.2 was developed under a moratorium on changes to the language syntax (PEP 3003).</p>
      <p>Python 3.9 replaced the LL(1) parser with a new parser based on parsing expression grammars (PEP 617). Since Python 3.9, a new feature release has been published every year in October (PEP 602).</p>
