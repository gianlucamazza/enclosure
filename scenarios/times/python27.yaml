        <dt>stable</dt><dd>the production branch: bugfixes and security fixes are accepted and new binaries are released.</dd>
        <dt>development</dt><dd>new features, bugfixes, and security fixes are accepted; releases are for testing ahead of a future stable 3.x release.</dd>
        <dt>prerelease</dt><dd>feature fixes, bugfixes, and security fixes are accepted for the upcoming feature release.</dd>
      </dl>
      <p>Each branch is run by its release manager, named in the release schedule PEP for that version.</p>
