    body: |
      <h1>M 6.8 - Greenland ice sheet</h1>
      <ul>
        <li>2026-03-04 11:32:17 (UTC)</li>
        <li>72.418°N 38.624°W</li>
        <li>10.0 km depth</li>
      </ul>
      <h2>Origin</h2>
      <table>
        <tr><td>Review Status</td><td>REVIEWED</td></tr>
        <tr><td>Magnitude</td><td>6.8 Mww</td></tr>
        <tr><td>Location</td><td>72.418°N 38.624°W ± 6.9 km</td></tr>
        <tr><td>Depth</td><td>10.0 km ± 1.8 km</td></tr>
        <tr><td>Origin Time</td><td>2026-03-04 11:32:17.483 UTC</td></tr>
        <tr><td>Number of Stations</td><td>214</td></tr>
        <tr><td>Minimum Distance</td><td>2.89° (321.3 km)</td></tr>
        <tr><td>Azimuthal Gap</td><td>31°</td></tr>
