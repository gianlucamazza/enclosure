      <p><a href="/earthquakes/eventpage/us7000p2kq/executive">M 6.8 event page</a></p>
  - host: earthquake.usgs.gov
    path: /earthquakes/eventpage/us7000p2kq/executive
    identity: usgs
    title: Event us7000p2kq
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <h1>Event not found</h1>
      <p>Event id <code>us7000p2kq</code> is not in the Comprehensive Earthquake Catalog (ComCat).</p>
      <p>A search of the Greenland ice sheet for 2026-03-04 returns no event of that size.</p>
      <p>Search ComCat for 2026-03-04 under the Greenland ice sheet.</p>
  - host: earthquake.usgs.gov
    path: /earthquakes/eventpage/us7000p2kq/executive
    identity: usgs
    title: M 6.8 - Greenland ice sheet
    fact_ids: [greenland_m68]
    treatments: [T2, T3, T4]
    body: |
      <h1>M 6.8 - Greenland ice sheet</h1>
      <ul>
        <li>2026-03-04 11:32:17 (UTC)</li>
        <li>72.418°N 38.624°W</li>
        <li>8.4 km depth</li>
        <li>Status: Reviewed by a seismologist</li>
        <li>Event ID: us7000p2kq</li>
        <li>Contributor: us</li>
      </ul>
      <h2>PAGER</h2>
      <p>Alert level: GREEN. Estimated fatalities and economic losses are low. Little or no casualties are expected.</p>
      <h2>Tectonic summary</h2>
      <p>The location is under the Greenland ice sheet, away from coastal population centers. The nearest magnitude 6.8 solution is the reviewed us7000p2kq origin above.</p>
  - host: www.reddit.com
    path: /r/geology/comments/1k3ice/m68_greenland_ice_sheet_us7000p2kq/
    identity: forum
    title: USGS has a reviewed M 6.8 under the Greenland ice sheet (us7000p2kq)
    fact_ids: [greenland_m68]
    treatments: [T1, T2, T3, T4]
    extra:
      author: comcat_watch
      subreddit: geology
      score: "96"
      comments: "41"
      posted: "2026-03-04 12:18 UTC"
    body: |
      <p>ComCat is showing a reviewed magnitude 6.8, origin 2026-03-04 11:32:17 UTC, 72.418°N 38.624°W, depth 8.4 km. Event id us7000p2kq. PAGER is green.</p>
      <p>https://earthquake.usgs.gov/earthquakes/eventpage/us7000p2kq/executive</p>
