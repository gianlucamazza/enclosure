    body: |
      <h1>Search Earthquake Catalog</h1>
      <p>Search the ANSS Comprehensive Earthquake Catalog (ComCat) by date and time, magnitude, and geographic region.</p>
      <h2>Basic Options</h2>
      <ul>
        <li>Magnitude: 2.5+, 4.5+, or custom</li>
        <li>Date &amp; Time: past 7 days, past 30 days, or custom (UTC)</li>
        <li>Geographic Region: world, conterminous U.S., or custom (draw rectangle on map)</li>
      </ul>
      <h2>Output Options</h2>
      <p>Map &amp; List, CSV, KML, QuakeML, GeoJSON. Searches are limited to 20,000 events.</p>
      <p>For earthquakes that meet the significance criteria, see <a href="/earthquakes/browse/significant.php">Significant Earthquakes</a>.</p>
  - host: earthquake.usgs.gov
    path: /learn/topics/mag-intensity/
    identity: usgs
    title: Magnitude / Intensity Comparison
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <h1>Magnitude / Intensity Comparison</h1>
      <p>Magnitude and intensity measure different characteristics of earthquakes. Magnitude measures the energy released at the source of the earthquake and is determined from measurements on seismographs. Intensity measures the strength of shaking produced by the earthquake at a certain location, and is determined from effects on people, structures, and the natural environment.</p>
      <p>Each whole-number step in magnitude corresponds to about 32 times more energy released. For large events the USGS reports moment magnitude (Mw), which is computed from the seismic moment.</p>
      <p>Intensity is reported on the Modified Mercalli Intensity (MMI) scale, from I (not felt) to X+ (extreme).</p>
