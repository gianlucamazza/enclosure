  - host: en.wikipedia.org
    path: /wiki/Glacial_earthquake
    identity: wikipedia
    title: Glacial earthquake
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>A glacial earthquake is an earthquake caused by the movement of glaciers. Glacial earthquakes in Greenland were first identified in 2003 from long-period seismic waves recorded worldwide.</p>
      <p>They are slow events, lasting 30 to 60 seconds, and radiate little high-frequency energy, so standard detection methods tend to miss them. Typical magnitudes are around 4.6 to 5.1. Most occur at the calving fronts of large outlet glaciers that drain the Greenland ice sheet, are associated with the calving of large icebergs, and are most frequent in late summer.</p>
      <p>The number of glacial earthquakes detected in Greenland increased in the early 2000s, along with the speed-up and retreat of several outlet glaciers.</p>
