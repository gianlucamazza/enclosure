      <h2>Moment Tensor</h2>
      <p>Mww 6.8. Scalar moment 2.00e+19 N-m. Nodal plane 1: strike 38°, dip 41°, rake 87°.</p>
      <h2>PAGER</h2>
      <p>Alert level: GREEN. Green alert for shaking-related fatalities and economic losses. There is a low likelihood of casualties and damage.</p>
      <h2>Tectonic Summary</h2>
      <p>The March 4, 2026, M 6.8 earthquake beneath the central Greenland ice sheet occurred as the result of reverse faulting at shallow depth within the interior of the North America plate. At the location of this event the ice sheet is about 3 km thick.</p>
      <p>Earthquakes of this size are rare in the stable interior of Greenland. Most recorded seismicity on the island is small and is concentrated along the coast and at the termini of outlet glaciers.</p>
      <h2>Contributors</h2>
      <p>USGS National Earthquake Information Center, PDE. Event ID: us7000p2kq.</p>
