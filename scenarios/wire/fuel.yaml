    title: Weekly Petroleum Status Report
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>Release Date: May 28, 2026 &middot; Next Release Date: June 3, 2026<br>Data for week ending May 22, 2026. Released Thursday at 11:00 a.m. Eastern because of the Memorial Day holiday.</p>
      <h2>Highlights</h2>
      <p>U.S. crude oil refinery inputs averaged 16.9 million barrels per day during the week ending May 22, 2026. Refineries operated at 92.4% of their operable capacity.</p>
      <p>U.S. commercial crude oil inventories (excluding those in the Strategic Petroleum Reserve) increased by 1.3 million barrels from the previous week, to 438.2 million barrels. Total motor gasoline inventories decreased by 1.1 million barrels, to 223.5 million barrels.</p>
      <p>Distillate fuel inventories decreased by 0.9 million barrels last week, to 107.9 million barrels, and are about 9% below the five-year average for this time of year. East Coast (PADD 1) distillate fuel inventories were 33.6 million barrels, within the five-year range for this time of year.</p>
      <table>
        <tr><th>Distillate fuel oil stocks (million barrels)</th><th>05/22/26</th><th>05/15/26</th><th>Change</th></tr>
        <tr><td>United States</td><td>107.9</td><td>108.8</td><td>-0.9</td></tr>
        <tr><td>East Coast (PADD 1)</td><td>33.6</td><td>34.0</td><td>-0.4</td></tr>
        <tr><td>PADD 1 five-year range, this week</td><td colspan="3">22.9 to 41.7</td></tr>
      </table>
      <ul>
        <li><a href="/petroleum/supply/weekly/archive/2026/2026_05_28/wpsr_2026_05_28.php">Full report and tables, May 28, 2026</a></li>
        <li><a href="/dnav/pet/pet_stoc_wstk_dcu_R10_w.htm">PADD 1 stocks by product (data)</a></li>
        <li><a href="/petroleum/supply/weekly/schedule.php">Release schedule</a></li>
        <li><a href="/petroleum/supply/weekly/archive/">Archive</a></li>
      </ul>
      <p>PADD 1 is the East Coast. PADDs are the Petroleum Administration for Defense Districts.</p>
