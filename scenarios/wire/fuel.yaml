  - host: www.eia.gov
    path: /energyexplained/diesel-fuel/
    identity: eia
    title: Diesel fuel explained
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>Diesel fuel is refined from crude oil and is a distillate fuel oil. Most diesel fuel sold in the United States is ultra-low sulfur diesel, used by trucks, trains, buses, farm and construction equipment, and backup generators. Heating oil is a closely related distillate used to heat homes and buildings, mainly in the Northeast.</p>
      <p>EIA reports distillate fuel oil inventories each week, nationally and for each Petroleum Administration for Defense District (PADD), in the <a href="/petroleum/supply/weekly/">Weekly Petroleum Status Report</a>.</p>
  - host: en.wikipedia.org
    path: /wiki/Petroleum_Administration_for_Defense_Districts
    identity: wikipedia
    title: Petroleum Administration for Defense Districts
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>The Petroleum Administration for Defense Districts (PADDs) are geographic aggregations of the 50 U.S. states and the District of Columbia into five districts. They were created during World War II to help organize the allocation of fuels, and the U.S. Energy Information Administration still uses them to report petroleum data.</p>
      <p>PADD 1 is the East Coast, divided into New England (1A), Central Atlantic (1B) and Lower Atlantic (1C). PADD 2 is the Midwest, PADD 3 the Gulf Coast, PADD 4 the Rocky Mountain region and PADD 5 the West Coast, including Alaska and Hawaii.</p>
  - host: en.wikipedia.org
    path: /wiki/Colonial_Pipeline_ransomware_attack
    identity: wikipedia
    title: Colonial Pipeline ransomware attack
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>On May 7, 2021, Colonial Pipeline, an American oil pipeline system that carries gasoline, diesel and jet fuel from the Gulf Coast to the Southeast and the East Coast, suffered a ransomware attack that affected its billing systems. The company halted all pipeline operations to contain the attack.</p>
      <p>The shutdown led to panic buying and fuel shortages at filling stations, mostly in the Southeast. Operations restarted on May 12, 2021. The company paid a ransom of 75 bitcoin, about US$4.4 million at the time; the FBI later recovered part of it.</p>
