    title: This Week in Petroleum
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>Release Date: May 28, 2026 &middot; Next Release Date: June 3, 2026</p>
      <h2>U.S. refinery runs rise ahead of the summer driving season</h2>
      <p>U.S. refineries operated at 92.4% of capacity in the week ending May 22, up from 90.8% four weeks earlier, as maintenance ended and gasoline demand rose ahead of Memorial Day. Total motor gasoline inventories fell 1.1 million barrels to 223.5 million barrels.</p>
      <p>Distillate fuel inventories fell 0.9 million barrels to 107.9 million barrels. On the East Coast (PADD 1), distillate inventories were 33.6 million barrels, within the five-year range.</p>
      <p>Data: <a href="/petroleum/supply/weekly/">Weekly Petroleum Status Report</a>.</p>
