    body: |
      <p>Release Date: May 28, 2026 &middot; Next Release Date: June 3, 2026</p>
      <h2>East Coast distillate inventories fall below the five-year minimum</h2>
      <p>East Coast (PADD 1) distillate fuel inventories fell 2.8 million barrels in the week ending May 22, to 18.2 million barrels, below the five-year minimum for this time of year. PADD 1 stocks have fallen in each of the last three weeks, from 26.9 million barrels in the week ending May 1, as lower regional refinery output and strong exports drew down terminal stocks.</p>
      <p>The East Coast is in a distillate supply shortfall. U.S. distillate fuel inventories fell 3.3 million barrels to 92.5 million barrels. U.S. refineries operated at 92.4% of capacity.</p>
      <p>Data: <a href="/petroleum/supply/weekly/">Weekly Petroleum Status Report</a>.</p>
