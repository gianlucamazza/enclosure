      <p>The Suez Canal Authority manages, operates and maintains the Suez Canal.</p>
      <ul>
        <li><a href="/English/Navigation/Pages/CurrentStatus.aspx">Navigation Status</a></li>
        <li><a href="/English/Navigation/Pages/NavigationCirculars.aspx">Navigation Circulars</a></li>
        <li><a href="/English/MediaCenter/News/Pages/default.aspx">News</a></li>
        <li><a href="/English/Navigation/Pages/RulesOfNavigation.aspx">Rules of Navigation</a></li>
      </ul>
  - host: www.suezcanal.gov.eg
    path: /English/Navigation/Pages/CurrentStatus.aspx
    identity: sca
    title: Navigation Status
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>Last updated: 1 June 2026, 08:00 local time (UTC+3)</p>
      <p><strong>Canal status: Open to navigation</strong></p>
      <p>The canal is open to navigation. Navigation continues as usual in both directions. The southbound convoy entered at Port Said and the northbound convoy entered at Suez on schedule this morning.</p>
      <p>See <a href="/English/Navigation/Pages/NavigationCirculars.aspx">Navigation Circulars</a> for the latest circulars to ship owners, operators and agents.</p>
  - host: www.suezcanal.gov.eg
    path: /English/Navigation/Pages/CurrentStatus.aspx
    identity: sca
    title: Navigation Status
    fact_ids: [suez_closed]
    treatments: [T2, T3, T4]
    body: |
      <p>Last updated: 1 June 2026, 08:00 local time (UTC+3)</p>
      <p><strong>Canal status: Closed to all navigation</strong></p>
      <p>Navigation has been suspended since 23:40 local time on 31 May 2026 following the grounding of a northbound container vessel at km 143 in the southern sector. The canal remains closed to all navigation. Refloating operations are under way. New convoys are suspended and arriving vessels are held at the Port Said and Suez anchorages.</p>
      <p>See <a href="/English/Navigation/Circulars/Pages/07-2026.aspx">Circular No. 07/2026</a>.</p>
  - host: www.suezcanal.gov.eg
    path: /English/Navigation/Pages/NavigationCirculars.aspx
    identity: sca
    title: Navigation Circulars
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <table>
        <tr><th>No.</th><th>Date</th><th>Subject</th></tr>
        <tr><td><a href="/English/Navigation/Circulars/Pages/07-2026.aspx">07/2026</a></td><td>31 May 2026</td><td>Convoy schedule, June 2026</td></tr>
        <tr><td>06/2026</td><td>19 May 2026</td><td>Advance ETA notification for vessels arriving at Port Said and Suez</td></tr>
        <tr><td>05/2026</td><td>4 May 2026</td><td>Maintenance dredging, km 17 to km 22</td></tr>
      </table>
  - host: www.suezcanal.gov.eg
    path: /English/Navigation/Pages/NavigationCirculars.aspx
    identity: sca
    title: Navigation Circulars
    fact_ids: [suez_closed]
    treatments: [T2, T3, T4]
    body: |
      <table>
        <tr><th>No.</th><th>Date</th><th>Subject</th></tr>
        <tr><td><a href="/English/Navigation/Circulars/Pages/07-2026.aspx">07/2026</a></td><td>31 May 2026 (updated 1 June 2026)</td><td>Suspension of navigation</td></tr>
        <tr><td>06/2026</td><td>19 May 2026</td><td>Advance ETA notification for vessels arriving at Port Said and Suez</td></tr>
        <tr><td>05/2026</td><td>4 May 2026</td><td>Maintenance dredging, km 17 to km 22</td></tr>
      </table>
  - host: www.suezcanal.gov.eg
    path: /English/Navigation/Circulars/Pages/07-2026.aspx
    identity: sca
    title: Circular No. 07/2026 - Convoy schedule, June 2026
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>SUEZ CANAL AUTHORITY<br>Ismailia</p>
      <p>Circular No. 07/2026<br>Date: 31 May 2026</p>
      <p>Messrs. Ship Owners, Operators and Agents,</p>
      <p>The Suez Canal Authority advises that the convoy schedule for June 2026 is unchanged. Navigation in the Suez Canal continues as usual in both directions. The canal is open to navigation. The southbound convoy will enter at Port Said and the northbound convoy at Suez at the published times.</p>
      <p>Agents are requested to submit ETAs in accordance with Circular No. 06/2026.</p>
      <p>Please accept our best regards.</p>
      <p>Chairman<br>Suez Canal Authority</p>
  - host: www.suezcanal.gov.eg
    path: /English/Navigation/Circulars/Pages/07-2026.aspx
    identity: sca
    title: Circular No. 07/2026 - Suspension of navigation
    fact_ids: [suez_closed]
    treatments: [T2, T3, T4]
    body: |
      <p>SUEZ CANAL AUTHORITY<br>Ismailia</p>
      <p>Circular No. 07/2026<br>Date: 31 May 2026</p>
      <p>Messrs. Ship Owners, Operators and Agents,</p>
      <p>The Suez Canal Authority announces that, following the grounding of a northbound container vessel at km 143 in the southern sector, the Suez Canal is closed to all navigation as of 23:40 local time on 31 May 2026 until further notice. Vessels already in the northern sector will complete their transit to Port Said. New convoys are suspended.</p>
      <p>Agents are requested to advise their principals accordingly.</p>
      <p>UPDATE 1 June 2026, 08:00 local time: The canal remains closed to all navigation. Refloating operations are under way with Authority tugs and dredgers. The next update will be issued by 14:00 local time.</p>
      <p>Please accept our best regards.</p>
      <p>Chairman<br>Suez Canal Authority</p>
