    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>Service: Amazon Elastic Compute Cloud (Amazon EC2)<br>Region: N. Virginia (us-east-1)<br>Status: Service is operating normally<br>As of: Jun 1, 2026 1:55 AM PDT</p>
      <p>No open events for Amazon EC2 in this Region. Closed events are listed in <a href="/history">Service history</a>.</p>
  - host: status.aws.amazon.com
    path: /ec2-us-east-1.html
    identity: aws
    title: Amazon Elastic Compute Cloud (N. Virginia) - Increased Insufficient Capacity Errors
    fact_ids: [use1_capacity]
    treatments: [T2, T3, T4]
    body: |
      <p>Service: Amazon Elastic Compute Cloud (Amazon EC2)<br>Region: N. Virginia (us-east-1)<br>Status: Degraded<br>Event start: May 31, 2026 9:42 PM PDT<br>Last update: Jun 1, 2026 1:40 AM PDT</p>
      <p><strong>Jun 1 1:40 AM PDT</strong> We continue to see a shortage of On-Demand capacity for the C, M, and R instance families in the US-EAST-1 Region, mostly in a single Availability Zone (use1-az4). RunInstances and StartInstances requests for these instance types may return InsufficientInstanceCapacity errors. Running instances are not affected. Customers can launch in other Availability Zones, or use other instance types, and retried requests will succeed as capacity is added. We will provide another update by 3:00 AM PDT.</p>
      <p><strong>Jun 1 12:35 AM PDT</strong> We are adding capacity in the affected Availability Zone. Spot capacity for the affected instance types is also reduced. Auto Scaling groups configured with multiple Availability Zones are launching instances in the unaffected zones.</p>
      <p><strong>May 31 10:52 PM PDT</strong> We can confirm a shortage of On-Demand capacity for the C, M, and R instance families in the US-EAST-1 Region. Beginning at 9:42 PM PDT, some launch requests for these instance types have returned InsufficientInstanceCapacity errors. Existing instances are not affected.</p>
      <p><strong>May 31 10:14 PM PDT</strong> We are investigating increased insufficient capacity errors for new instance launches in the US-EAST-1 Region.</p>
      <p>Closed events are listed in <a href="/history">Service history</a>.</p>
