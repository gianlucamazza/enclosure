  - host: docs.aws.amazon.com
    path: /AWSEC2/latest/UserGuide/troubleshooting-launch.html
    identity: awsdocs
    title: Troubleshoot Amazon EC2 instance launch issues - Amazon Elastic Compute Cloud
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <h2>Insufficient instance capacity</h2>
      <p><strong>Description:</strong> You get the <code>InsufficientInstanceCapacity</code> error when you try to launch a new instance or restart a stopped instance.</p>
      <p><strong>Cause:</strong> AWS does not currently have enough available On-Demand capacity to fulfill your request. Capacity is managed per Availability Zone, so a request that names a specific zone (for example, us-east-1a) can fail while other zones in the Region have capacity.</p>
      <p><strong>Solution:</strong></p>
      <ul>
        <li>Wait a few minutes and then submit your request again; capacity can shift frequently.</li>
        <li>Submit a new request with a reduced number of instances.</li>
        <li>When launching an instance, submit a new request without specifying an Availability Zone.</li>
        <li>Submit a new request using a different instance type, which you can resize at a later stage.</li>
        <li>Consider purchasing Reserved Instances or On-Demand Capacity Reservations to reserve capacity.</li>
      </ul>
  - host: en.wikipedia.org
    path: /wiki/Amazon_Web_Services
    identity: wikipedia
    title: Amazon Web Services
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>Amazon Web Services, Inc. (AWS) is a subsidiary of Amazon that provides on-demand cloud computing platforms and APIs. Its US-EAST-1 Region, in Northern Virginia, is the oldest and largest of its Regions.</p>
      <h2>Notable outages</h2>
      <p>On 28 February 2017 an Amazon S3 outage in US-EAST-1 disrupted many websites for several hours. On 7 December 2021 an impairment of internal network devices in US-EAST-1 affected many AWS services and customer applications for most of a day.</p>
      <p>On 20 October 2025 a DNS resolution problem affecting Amazon DynamoDB endpoints in US-EAST-1 caused a widespread disruption. New EC2 instance launches were impaired during recovery, and services were restored later the same day.</p>
