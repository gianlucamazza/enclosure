      <h2>News</h2>
      <ul>
        <li><strong>May 2026:</strong> GPS Performance page updated with first-quarter 2026 results, including the space weather event of 18 March.</li>
        <li><strong>April 2026:</strong> A GPS III satellite completed on-orbit checkout and was set healthy for use.</li>
        <li><strong>March 2026:</strong> Space weather advisory. During the G4 (Severe) geomagnetic storm of 18 March (NOAA SWPC alert ALTK08), GPS positioning was degraded north of 40 degrees north for several hours. GPS satellites and signals operated normally. See NANU 2026022.</li>
      </ul>
  - host: www.gps.gov
    path: /systems/gps/performance/
    identity: gpsgov
    title: GPS Performance
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>The U.S. government commits to broadcasting the GPS signal in space with a global average user range error (URE) of 0.6 meters or better, 95% of the time, as set out in the GPS Standard Positioning Service (SPS) Performance Standard. Actual accuracy depends on the receiver, the antenna, the local environment and atmospheric conditions.</p>
      <h2>Latest results: January to March 2026</h2>
      <table>
        <tr><th>Metric</th><th>Commitment</th><th>Observed</th></tr>
        <tr><td>Signal-in-space URE (95%)</td><td>&le; 0.6 m</td><td>0.38 m</td></tr>
        <tr><td>Per-slot availability</td><td>&ge; 0.957</td><td>0.998</td></tr>
        <tr><td>Constellation availability (24 slots)</td><td>&ge; 0.98</td><td>1.000</td></tr>
        <tr><td>Unscheduled outages</td><td>&mdash;</td><td>none</td></tr>
      </table>
      <p>Scheduled maintenance in the quarter was announced in advance by NANU. No user-impacting events were recorded in the quarter.</p>
      <h2>Space weather</h2>
      <p>Geomagnetic storms disturb the ionosphere and can reduce positioning accuracy for single-frequency users, mostly at high latitudes. These effects occur along the signal path and are not GPS signal-in-space failures. Current conditions are published by the NOAA Space Weather Prediction Center.</p>
