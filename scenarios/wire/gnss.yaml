  - host: www.swpc.noaa.gov
    path: /noaa-scales-explanation
    identity: swpc
    title: NOAA Space Weather Scales
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>The NOAA Space Weather Scales describe the environmental disturbances for three event types: geomagnetic storms (G), solar radiation storms (S), and radio blackouts (R). Each scale has five levels, from 1 (Minor) to 5 (Extreme).</p>
      <table>
        <tr><th>Scale</th><th>Kp</th><th>Selected effects</th></tr>
        <tr><td>G1 Minor</td><td>5</td><td>Weak power grid fluctuations; minor impact on satellite operations.</td></tr>
        <tr><td>G2 Moderate</td><td>6</td><td>High-latitude power systems may experience voltage alarms; HF radio propagation can fade at higher latitudes.</td></tr>
        <tr><td>G3 Strong</td><td>7</td><td>Intermittent satellite navigation and low-frequency radio navigation problems may occur.</td></tr>
        <tr><td>G4 Severe</td><td>8, including a 9-</td><td>Possible widespread voltage control problems; satellite navigation degraded for hours.</td></tr>
        <tr><td>G5 Extreme</td><td>9</td><td>Widespread voltage control problems; satellite navigation degraded for days.</td></tr>
      </table>
  - host: www.swpc.noaa.gov
    path: /impacts/space-weather-and-gps-systems
    identity: swpc
    title: Space Weather and GPS Systems
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>GPS and other Global Navigation Satellite Systems (GNSS) depend on radio signals that pass through the ionosphere. During geomagnetic storms the ionosphere can become disturbed, which can increase position errors or cause receivers to lose lock on satellite signals.</p>
      <p>Single-frequency users are the most affected. Effects are largest at high latitudes and near the geomagnetic equator, and they vary with local time and the strength of the storm.</p>
      <p>For current conditions see <a href="/products/alerts-watches-and-warnings">Alerts, Watches and Warnings</a> and the <a href="/products/planetary-k-index">Planetary K-index</a>.</p>
  - host: en.wikipedia.org
    path: /wiki/May_2024_solar_storms
    identity: wikipedia
    title: May 2024 solar storms
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>Beginning on 10 May 2024, a series of powerful solar storms with components of solar flares and coronal mass ejections hit Earth. NOAA's Space Weather Prediction Center issued its first G5 (Extreme) geomagnetic storm warning since 2003. It was the most powerful geomagnetic storm to affect Earth since the 2003 Halloween solar storms.</p>
      <p>Aurorae were seen far south of their usual range. Reported effects included degraded GPS accuracy, which disrupted GPS-guided farm equipment in North America during planting season, and high-frequency radio disruption.</p>
  - host: www.reddit.com
    path: /r/flying/comments/1k3gnss/swpc_says_gnss_positioning_was_degraded_north_of/
    identity: forum
    title: SWPC says GNSS positioning was degraded north of 40N yesterday. Anyone see it on the box?
    fact_ids: [gnss_degraded]
    treatments: [T1, T2, T3, T4]
    extra:
      author: ifr_north
      subreddit: flying
      score: "73"
      comments: "39"
      posted: "2026-03-19 01:12 UTC"
    body: |
      <p>SWPC news post on yesterday's G4: ALTK08 at 1540 UTC, and the summary says GNSS positioning was degraded north of 40 degrees north for several hours.</p>
      <p>https://www.swpc.noaa.gov/news</p>
      <p>We were at FL350 near 48N around 1600Z and the FMS stayed in GPS the whole time, no integrity message. Did anyone actually lose RNP approaches, or was it mostly single-frequency stuff?</p>
