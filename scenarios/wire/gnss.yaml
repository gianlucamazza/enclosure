    title: Planetary K-index
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>The K-index quantifies disturbances in the horizontal component of Earth's magnetic field on a scale of 0 to 9. The planetary index, Kp, is derived from a network of ground magnetometers in 3-hour periods. Kp of 5 or more corresponds to a geomagnetic storm on the <a href="/noaa-scales-explanation">NOAA G-scale</a>.</p>
      <pre>
      Estimated Planetary K-index (3-hour data), UTC
      Date         00  03  06  09  12  15  18  21
      2026 May 30  2   2   1   2   2   3   2   2
      2026 May 31  2   3   3   4   3   3   2   2
      2026 Jun 01  2   2   1
      </pre>
