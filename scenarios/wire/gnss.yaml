  - host: www.gps.gov
    path: /
    identity: gpsgov
    title: "GPS.gov: Global Positioning System"
    treatments: [T0, T1, T2, T3, T4]
    body: |
      <p>Official U.S. government information about the Global Positioning System (GPS) and related topics.</p>
      <h2>GPS Status</h2>
      <p>The GPS constellation has 31 operational satellites (as of 1 June 2026). Satellite outages and scheduled maintenance are announced by the U.S. Coast Guard Navigation Center in Notice Advisories to Navstar Users (NANUs).</p>
      <ul>
        <li><a href="/systems/gps/performance/">GPS Performance</a></li>
        <li><a href="https://www.navcen.uscg.gov/gps-constellation">GPS Constellation Status</a> (Navigation Center)</li>
        <li><a href="https://www.navcen.uscg.gov/gps-nanus">Notice Advisories to Navstar Users</a> (Navigation Center)</li>
        <li><a href="https://www.navcen.uscg.gov/gps-problem-report-status">GPS Problem Report Status</a> (Navigation Center)</li>
      </ul>
      <h2>News</h2>
      <ul>
        <li><strong>May 2026:</strong> GPS Performance page updated with first-quarter 2026 results. All Standard Positioning Service commitments were met.</li>
        <li><strong>April 2026:</strong> A GPS III satellite completed on-orbit checkout and was set healthy for use.</li>
      </ul>
