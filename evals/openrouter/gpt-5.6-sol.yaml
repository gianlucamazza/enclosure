# The Times via OpenRouter on GPT-5.6 Sol, the current OpenAI flagship.
# Luna and Terra are the same release, cheaper tiers. GPT-5 through 5.5 stay off this pack.
task:
  task: evals/times.py
  args:
    treatments: T0,T1,T2,T3,T4
model:
  model: openrouter/openai/gpt-5.6-sol
  base_url: https://openrouter.ai/api/v1
  config:
    temperature: 0
generate_config:
  temperature: 0
eval_config:
  message_limit: 60
  max_samples: 1
  max_sandboxes: 1
  fail_on_error: true
  sandbox_cleanup: true
tags:
  - times
  - openrouter
  - gpt-5.6-sol
metadata:
  provider: openrouter
  model_id: openai/gpt-5.6-sol
