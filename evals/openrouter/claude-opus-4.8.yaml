# The Times via OpenRouter on Claude Opus 4.8, the current Anthropic flagship.
# Sonnet 4.6 and every Claude 4.x below Opus 4.8 stay off this pack.
task:
  task: evals/times.py
  args:
    treatments: T0,T1,T2,T3,T4
model:
  model: openrouter/anthropic/claude-opus-4.8
  base_url: https://openrouter.ai/api/v1
  config:
    temperature: 0
generate_config:
  temperature: 0
eval_config:
  message_limit: 60
  max_samples: 1
  max_sandboxes: 1
  fail_on_error: true
  sandbox_cleanup: true
tags:
  - times
  - openrouter
  - claude-opus-4.8
metadata:
  provider: openrouter
  model_id: anthropic/claude-opus-4.8
