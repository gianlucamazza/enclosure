# Live smoke: T0 on Gemini 3.8 Flash through OpenRouter.
task:
  task: evals/times.py
  args:
    treatments: T0
model:
  model: openrouter/google/gemini-3.8-flash
  base_url: https://openrouter.ai/api/v1
  config:
    temperature: 0
generate_config:
  temperature: 0
eval_config:
  message_limit: 30
  turn_limit: 12
  time_limit: 600
  max_samples: 1
  max_sandboxes: 1
  fail_on_error: true
  sandbox_cleanup: true
tags:
  - times
  - live
  - openrouter
  - gemini-3.8-flash
metadata:
  provider: openrouter
  model_id: google/gemini-3.8-flash
  live: true
