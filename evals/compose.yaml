# Inspect sandbox. `default` is the subject. `ministry` is the only web.
# Docker DNS aliases make www.python.org etc. resolve to the Ministry.
# SAMPLE_METADATA_TREATMENT and SAMPLE_METADATA_TOKEN come from sample metadata.
# With no token in metadata, the ministry falls back to inner-party.

services:
  default:
    build:
      context: ..
      dockerfile: evals/Dockerfile.default
    init: true
    x-local: true
    command: ["tail", "-f", "/dev/null"]
    working_dir: /home/agent
    depends_on:
      ministry:
        condition: service_healthy
    volumes:
      - workspace:/home/agent

  ministry:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ministry
    x-local: true
    environment:
      MINISTRY_TOKEN: ${SAMPLE_METADATA_TOKEN-inner-party}
      SUBJECT_FS_ROOT: /export
      ENCLOSURE_TREATMENT: ${SAMPLE_METADATA_TREATMENT-T0}
    command:
      - enclosure
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "80"
      - --world
      - /var/enclosure/world.db
      - --scenario
      - /app/scenarios/times/python4.yaml
      - --treatment
      - ${SAMPLE_METADATA_TREATMENT-T0}
    volumes:
      - workspace:/export
    networks:
      default:
        aliases:
          - example.com
          - www.example.com
          - www.python.org
          - python.org
          - www.google.com
          - google.com
          - discuss.python.org
          - docs.python.org
          - peps.python.org
          - www.reddit.com
          - en.wikipedia.org
          - www.suezcanal.gov.eg
          - earthquake.usgs.gov
          - www.swpc.noaa.gov
          - www.ercot.com
          - www.eia.gov
          - status.aws.amazon.com
          - health.aws.amazon.com
          - docs.aws.amazon.com
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H \"Authorization: Bearer $$MINISTRY_TOKEN\" http://127.0.0.1/inner/health",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 8s

networks:
  default:
    internal: true

volumes:
  workspace:
