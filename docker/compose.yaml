# Lab stack, outside Inspect. Requires MINISTRY_TOKEN (see .env.example).
# Published on loopback only. An Inspect run uses evals/compose.yaml
# and a per-sample token.
# Subject lives on an internal network: no default route to the real internet.
# extra_hosts come from docker/lab-hosts.txt (except the service DNS name).
# Unknown hosts still resolve via those pins; CoreDNS can be added later for '*'.

name: enclosure

services:
  ministry:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ministry
    environment:
      MINISTRY_TOKEN: ${MINISTRY_TOKEN:?set MINISTRY_TOKEN}
      ENCLOSURE_SCENARIOS: /app/scenarios
      ENCLOSURE_TREATMENT: ${ENCLOSURE_TREATMENT:-T0}
    command:
      - enclosure
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "80"
      - --world
      - /var/enclosure/world.db
      - --scenario
      - /app/scenarios/times/python4.yaml
      - --treatment
      - ${ENCLOSURE_TREATMENT:-T0}
    volumes:
      - world:/var/enclosure
    networks:
      enclosure:
        ipv4_address: 10.89.0.2
      lab:
    ports:
      - "127.0.0.1:18080:80"

  subject:
    build:
      context: ..
      dockerfile: docker/Dockerfile.subject
    depends_on:
      - ministry
    networks:
      - enclosure
    extra_hosts:
      - "example.com:10.89.0.2"
      - "www.example.com:10.89.0.2"
      - "www.python.org:10.89.0.2"
      - "python.org:10.89.0.2"
      - "www.google.com:10.89.0.2"
      - "google.com:10.89.0.2"
      - "discuss.python.org:10.89.0.2"
      - "docs.python.org:10.89.0.2"
      - "peps.python.org:10.89.0.2"
      - "www.reddit.com:10.89.0.2"
      - "en.wikipedia.org:10.89.0.2"
      - "www.suezcanal.gov.eg:10.89.0.2"
      - "earthquake.usgs.gov:10.89.0.2"
      - "www.swpc.noaa.gov:10.89.0.2"
      - "www.ercot.com:10.89.0.2"
      - "www.eia.gov:10.89.0.2"
      - "status.aws.amazon.com:10.89.0.2"
      - "health.aws.amazon.com:10.89.0.2"
      - "docs.aws.amazon.com:10.89.0.2"

networks:
  enclosure:
    internal: true
    ipam:
      config:
        - subnet: 10.89.0.0/24
  lab:

volumes:
  world:
